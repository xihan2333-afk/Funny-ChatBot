# 接入层本地栈（quickstart compose 冒烟）：mysql / redis / napcat 先就绪，access-layer 后起
# 使用：cd deploy && docker compose up -d（环境变量从仓库根 .env 读取，参照 .env.example）

name: funny-chatbot

services:

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${CHATBOT_MYSQL_PASSWORD:-dev123}
      MYSQL_DATABASE: funnychat
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p${CHATBOT_MYSQL_PASSWORD:-dev123}" ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # 协议端：OneBot 11 实现端（NapCat 末版镜像，可整体替换为任意 OneBot 11 实现——
  # 换端只改本服务的镜像与本文件配置，接入层代码零改动，详见 contracts/onebot-ws-adapter.md）
  napcat:
    image: mlikiowa/napcat-docker:latest
    environment:
      ACCOUNT: ${NAPCAT_ACCOUNT:-}
      WEBUI_TOKEN: ${NAPCAT_WEBUI_TOKEN:-dev-webui-token}
      TZ: Asia/Shanghai
    ports:
      # WebUI 扫码登录（首次部署用，登录完成后可关闭对外暴露）
      - "6099:6099"
    volumes:
      - napcat-qq:/app/.config/QQ
      - napcat-config:/app/napcat/config
    shm_size: 512mb
    restart: unless-stopped

  access-layer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MODULE: chatbot-access-layer
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      napcat:
        condition: service_started
    environment:
      # 部署层配置全部经环境变量注入（.env → 容器，改值重启进程，设计方案 3.4.7）
      NAPCAT_WS_URL: ${NAPCAT_WS_URL:-ws://napcat:3001/}
      ONEBOT_ACCESS_TOKEN: ${ONEBOT_ACCESS_TOKEN:-}
      ACCESS_EXPECTED_BOT_ID: ${ACCESS_EXPECTED_BOT_ID:-}
      CHATBOT_MYSQL_URL: jdbc:mysql://mysql:3306/funnychat?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai
      CHATBOT_MYSQL_USERNAME: root
      CHATBOT_MYSQL_PASSWORD: ${CHATBOT_MYSQL_PASSWORD:-dev123}
      CHATBOT_REDIS_HOST: redis
      CHATBOT_REDIS_PORT: "6379"
      ACCESS_MEDIA_STORE_ROOT: /data/media
      ENABLE_OTEL_AGENT: ${ENABLE_OTEL_AGENT:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRICS_EXPORTER: none
      OTEL_SERVICE_NAME: access-layer
      TZ: Asia/Shanghai
    volumes:
      # 媒体转存卷（与协议端共享场景挂同卷，出方向大媒体演进项）
      - ./volumes/access-layer/media:/data/media
      - ./otel:/opt/otel:ro
    ports:
      - "8081:8081"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # 主服务：核心引擎（消费入流、产出出流；模型未接入期间生成以 engine.* 错误结算——2.3 落地后接 LLM）
  agent-core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MODULE: chatbot-agent-core
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CHATBOT_MYSQL_URL: jdbc:mysql://mysql:3306/funnychat?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai
      CHATBOT_MYSQL_USERNAME: root
      CHATBOT_MYSQL_PASSWORD: ${CHATBOT_MYSQL_PASSWORD:-dev123}
      CHATBOT_REDIS_HOST: redis
      CHATBOT_REDIS_PORT: "6379"
      # 观测栈接入（005）：自建 SDK 导出与 ES 查询指向观测容器（.env 同名变量覆盖）
      CHATBOT_OTLP_ENDPOINT: ${CHATBOT_OTLP_ENDPOINT:-http://otel-collector:4317}
      CHATBOT_OTLP_ENABLED: ${CHATBOT_OTLP_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRICS_EXPORTER: none
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "false"
      ENABLE_OTEL_AGENT: ${ENABLE_OTEL_AGENT:-true}
      OTEL_SERVICE_NAME: agent-core
      CHATBOT_ES_URL: http://elasticsearch:9200
      CHATBOT_ES_USERNAME: elastic
      CHATBOT_ES_PASSWORD: ${CHATBOT_ES_PASSWORD:-dev-es-123}
      # 凭证加密主密钥（32 字节 Base64，启用 CredentialCodec / 轮换服务）
      CHATBOT_CREDENTIAL_KEY: ${CHATBOT_CREDENTIAL_KEY:-}
      # 管理平台首启种子（US9：must_change 强制改密）
      CHATBOT_ADMIN_INIT_USERNAME: ${CHATBOT_ADMIN_INIT_USERNAME:-admin}
      CHATBOT_ADMIN_INIT_PASSWORD: ${CHATBOT_ADMIN_INIT_PASSWORD:-}
      JAVA_OPTS: "-Xmx1024m -Xms512m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=64m -XX:+UseZGC"
      AGENT_WORKER_ID: "1"
      TZ: Asia/Shanghai
    volumes:
      - ./otel:/opt/otel:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  # 管理平台前端：Nginx 托管静态资源并反代 /api/management/ 到 agent-core
  admin-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.admin-web
    depends_on:
      agent-core:
        condition: service_healthy
    ports:
      - "${ADMIN_WEB_PORT:-5173}:80"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # 沙箱执行服务：独立进程（隔离边界部署原则——只有本服务挂 Docker 控制通道，agent-core 不挂）
  sandbox-executor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MODULE: chatbot-sandbox-executor
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      CHATBOT_MYSQL_URL: jdbc:mysql://mysql:3306/funnychat?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai
      CHATBOT_MYSQL_USERNAME: root
      CHATBOT_MYSQL_PASSWORD: ${CHATBOT_MYSQL_PASSWORD:-dev123}
      DOCKER_HOST: unix:///var/run/docker.sock
      TZ: Asia/Shanghai
    volumes:
      # Docker 控制通道只挂沙箱服务（agent-core 容器绝不挂 docker.sock——环境隔离的部署面）
      - /var/run/docker.sock:/var/run/docker.sock
      # python 沙箱镜像预拉取：测试机第三方镜像封锁时按 napcat 的 tar 中转经验导入
      # （docker save python:3.11-slim | docker load）
      - sandbox-python-image:/var/lib/preloaded
    ports:
      - "8082:8082"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # =====================================================================
  # 观测栈（005-observability-safety，设计方案 2.5.5 / R19）：
  # elasticsearch 8.11.4 单节点（与 elasticsearch-java 客户端小版本对齐）+
  # otel-collector contrib（OTLP 接收、按 log.category 路由、批量写入）。
  # 镜像版本进依赖矩阵登记（ChatBot设计方案.md 3.1.2）。
  # =====================================================================

  elasticsearch:
    image: elasticsearch:8.11.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${CHATBOT_ES_PASSWORD:-dev-es-123}
      ES_JAVA_OPTS: -Xms2g -Xmx2g
      TZ: Asia/Shanghai
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS -u elastic:${CHATBOT_ES_PASSWORD:-dev-es-123} http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # 索引模板与 ILM 策略初始化：一次性任务，首启执行成功后退出（幂等可重跑）
  es-init:
    image: elasticsearch:8.11.4
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./es-init:/es-init:ro
    entrypoint: [ "bash", "/es-init/init.sh" ]
    environment:
      ES_URL: http://elasticsearch:9200
      ES_USERNAME: elastic
      ES_PASSWORD: ${CHATBOT_ES_PASSWORD:-dev-es-123}
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    command: [ "--config=/etc/otel-collector.yaml" ]
    depends_on:
      elasticsearch:
        condition: service_healthy
      es-init:
        condition: service_completed_successfully
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    environment:
      ES_ENDPOINT: http://elasticsearch:9200
      ES_USERNAME: elastic
      ES_PASSWORD: ${CHATBOT_ES_PASSWORD:-dev-es-123}
    ports:
      # OTLP gRPC / HTTP 接收（应用与接入层的导出地址指向这里）
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:13133/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  napcat-qq:
  napcat-config:
  sandbox-python-image:
  es-data:
