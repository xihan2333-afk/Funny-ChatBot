# otel-collector 配置（005-observability-safety，设计方案 2.5.5 / R19）：
# OTLP gRPC/HTTP 接收 → memory_limiter + batch → 按 log.category 与信号类型
# 路由到 logs-agent-* / logs-system-* / traces 数据流 → elasticsearch exporter。
#
# 版本：otel/opentelemetry-collector-contrib:0.98.0（依赖矩阵登记，3.1.2）。
# ES 地址凭证经环境变量注入（compose 的 ES_ENDPOINT / ES_USERNAME / ES_PASSWORD，
# 出处 .env——凭证不出服务端，浏览器不直连 ES）。
#
# 路由拓扑（与 logback-spring.xml 的 log.category 语义对齐）：
#   traces        → elasticsearch/traces     → traces-* 数据流
#   logs(category=agent)  → elasticsearch/logs-agent   → logs-agent-* 数据流
#   logs(其它/默认)       → elasticsearch/logs-system  → logs-system-* 数据流
# 指标（javaagent 的 JVM 指标）0.98 的 elasticsearch exporter 不支持，列演进项；
# runtime 报表在支持版本升级后自动有数据（查询侧读 metrics-* 数据流）。

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # 内存上限 384MB（设计方案 2.8 资源预算）：超限先拒收再丢数据，保护宿主机
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
  batch:
    timeout: 5s
    send_batch_size: 512
  # 0.98.0 的 routing connector 仅评估 Resource 上下文，先把 log.category（及 appender 的 logback.mdc.log.category）提升为 Resource 属性并拆组
  groupbyattrs/log_category:
    keys:
      - log.category
      - logback.mdc.log.category

connectors:
  # 日志按 log.category 路由（应用侧 CategoryRoutingOtlpAppender 附加的属性；
  # 缺失或非 agent 一律走 system 数据流——宁落 system 不丢日志）
  routing/logs:
    default_pipelines: [ logs/system ]
    table:
      - statement: route() where attributes["log.category"] == "agent" or attributes["logback.mdc.log.category"] == "agent"
        pipelines: [ logs/agent ]

exporters:
  elasticsearch/traces:
    endpoints: [ "${env:ES_ENDPOINT}" ]
    user: "${env:ES_USERNAME}"
    password: "${env:ES_PASSWORD}"
    # traces 数据流由 es-init 的索引模板建（traces-*，ILM 14 天；名需匹配 traces-* 才能落入数据流）
    traces_index: traces-default
    retry:
      enabled: true
      initial_interval: 1s
      max_interval: 30s

  elasticsearch/logs-agent:
    endpoints: [ "${env:ES_ENDPOINT}" ]
    user: "${env:ES_USERNAME}"
    password: "${env:ES_PASSWORD}"
    logs_index: logs-agent-default
    logs_dynamic_index:
      enabled: false
    mapping:
      mode: ecs
    retry:
      enabled: true
      initial_interval: 1s
      max_interval: 30s

  elasticsearch/logs-system:
    endpoints: [ "${env:ES_ENDPOINT}" ]
    user: "${env:ES_USERNAME}"
    password: "${env:ES_PASSWORD}"
    logs_index: logs-system-default
    logs_dynamic_index:
      enabled: false
    mapping:
      mode: ecs
    retry:
      enabled: true
      initial_interval: 1s
      max_interval: 30s

service:
  extensions: [ health_check ]
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    # traces 直通（无按类路由需求）
    traces:
      receivers: [ otlp ]
      processors: [ memory_limiter, batch ]
      exporters: [ elasticsearch/traces ]
    # 日志先提升 log.category 为 Resource 属性，再经路由进各自管道
    logs/router:
      receivers: [ otlp ]
      processors: [ groupbyattrs/log_category ]
      exporters: [ routing/logs ]
    logs/agent:
      receivers: [ routing/logs ]
      processors: [ memory_limiter, batch ]
      exporters: [ elasticsearch/logs-agent ]
    logs/system:
      receivers: [ routing/logs ]
      processors: [ memory_limiter, batch ]
      exporters: [ elasticsearch/logs-system ]
